<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Integration Test UI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .card h2 {
            color: #667eea;
            font-size: 18px;
            margin-bottom: 15px;
            border-bottom: 2px solid #667eea;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            background: #667eea;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            width: 100%;
            font-size: 14px;
        }

        button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .status {
            padding: 15px;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 14px;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .response-box {
            background: #f5f5f5;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 12px;
            margin-top: 10px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
            color: #333;
        }

        .config-section {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .token-display {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 6px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 12px;
            word-break: break-all;
            color: #666;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🧪 API Integration Test</h1>
            <p>Công cụ test API tích hợp - Hãy kiểm tra các endpoint của bạn</p>
        </header>

        <!-- Config Section -->
        <div class="config-section">
            <h2>⚙️ Cấu Hình</h2>
            <div class="form-group">
                <label for="baseUrl">Base URL:</label>
                <input type="text" id="baseUrl" value="http://localhost:8080" placeholder="http://localhost:8080">
            </div>
            <div class="token-display" id="tokenDisplay">
                <strong>Token:</strong> Chưa có token. Đăng nhập để lấy token.
            </div>
        </div>

        <!-- Main Grid -->
        <div class="grid">
            <!-- Auth Card -->
            <div class="card">
                <h2>🔐 Authentication</h2>

                <div class="form-group">
                    <label for="registerEmail">Email:</label>
                    <input type="email" id="registerEmail" placeholder="user@example.com">
                </div>

                <div class="form-group">
                    <label for="registerPassword">Password:</label>
                    <input type="password" id="registerPassword" placeholder="Password123!">
                </div>

                <button onclick="testRegister()">📝 Register</button>
                <button onclick="testLogin()" style="margin-top: 10px;">🔑 Login</button>
                <button onclick="testRefreshToken()" style="margin-top: 10px;">🔄 Refresh Token</button>

                <div id="authStatus"></div>
            </div>

            <!-- Products Card -->
            <div class="card">
                <h2>📦 Products</h2>

                <div class="form-group">
                    <label for="productId">Product ID:</label>
                    <input type="text" id="productId" placeholder="product-id">
                </div>

                <button onclick="testGetProducts()">📋 Get All Products</button>
                <button onclick="testGetProductDetail()" style="margin-top: 10px;">🔍 Get Product Detail</button>

                <div id="productsStatus"></div>
            </div>

            <!-- Location Card -->
            <div class="card">
                <h2>📍 Locations</h2>

                <div class="form-group">
                    <label for="provinceCode">Province Code:</label>
                    <input type="text" id="provinceCode" placeholder="province-code">
                </div>

                <div class="form-group">
                    <label for="districtCode">District Code:</label>
                    <input type="text" id="districtCode" placeholder="district-code">
                </div>

                <button onclick="testGetProvinces()">🗺️ Get Provinces</button>
                <button onclick="testGetDistricts()" style="margin-top: 10px;">📍 Get Districts</button>
                <button onclick="testGetWards()" style="margin-top: 10px;">📍 Get Wards</button>

                <div id="locationsStatus"></div>
            </div>

            <!-- Orders Card -->
            <div class="card">
                <h2>📋 Orders</h2>

                <button onclick="testGetOrders()">📋 Get My Orders</button>

                <div id="ordersStatus"></div>
            </div>

            <!-- Profile Card -->
            <div class="card">
                <h2>👤 Profile</h2>

                <button onclick="testGetProfile()">👁️ Get Profile</button>

                <div id="profileStatus"></div>
            </div>

            <!-- Quick Tests Card -->
            <div class="card">
                <h2>⚡ Quick Actions</h2>

                <button onclick="testAll()">🚀 Run All Tests</button>
                <button onclick="clearAllTokens()" style="margin-top: 10px; background: #dc3545;">🗑️ Clear Tokens</button>
                <button onclick="copyToken()" style="margin-top: 10px; background: #28a745;">📋 Copy Token</button>

                <div id="quickStatus"></div>
            </div>
        </div>
    </div>

    <script>
        const API = {
            baseUrl: () => document.getElementById('baseUrl').value,
            accessToken: '',
            refreshToken: '',

            async fetch(method, path, data = null) {
                const url = `${this.baseUrl()}${path}`
                const options = {
                    method,
                    headers: {
                        'Content-Type': 'application/json',
                        'ngrok-skip-browser-warning': 'true',
                    }
                }

                if (this.accessToken) {
                    options.headers['Authorization'] = `Bearer ${this.accessToken}`
                }

                if (data) {
                    options.body = JSON.stringify(data)
                }

                try {
                    const response = await fetch(url, options)
                    const result = await response.json()

                    if (!response.ok) {
                        throw new Error(result.message || `HTTP ${response.status}`)
                    }

                    return result
                } catch (error) {
                    throw error
                }
            }
        }

        function updateTokenDisplay() {
            const display = document.getElementById('tokenDisplay')
            if (API.accessToken) {
                display.innerHTML = `<strong>Token:</strong> <div style="word-break: break-all; margin-top: 5px;">${API.accessToken.substring(0, 50)}...</div>`
            } else {
                display.innerHTML = '<strong>Token:</strong> Chưa có token. Đăng nhập để lấy token.'
            }
        }

        async function testRegister() {
            const statusEl = document.getElementById('authStatus')
            statusEl.innerHTML = '<div class="status info">⏳ Đang xử lý...</div>'

            try {
                const email = document.getElementById('registerEmail').value
                const password = document.getElementById('registerPassword').value

                if (!email || !password) {
                    throw new Error('Vui lòng nhập email và password')
                }

                const result = await API.fetch('POST', '/api/auth/register', {
                    email,
                    password,
                    firstName: 'Test',
                    lastName: 'User',
                    phone: '0901234567',
                    role: 'buyer'
                })

                statusEl.innerHTML = `<div class="status success">✅ Đăng ký thành công!<div class="response-box">${JSON.stringify(result, null, 2)}</div></div>`
            } catch (error) {
                statusEl.innerHTML = `<div class="status error">❌ Lỗi: ${error.message}<div class="response-box">${error.toString()}</div></div>`
            }
        }

        async function testLogin() {
            const statusEl = document.getElementById('authStatus')
            statusEl.innerHTML = '<div class="status info">⏳ Đang xử lý...</div>'

            try {
                const email = document.getElementById('registerEmail').value
                const password = document.getElementById('registerPassword').value

                if (!email || !password) {
                    throw new Error('Vui lòng nhập email và password')
                }

                const result = await API.fetch('POST', '/api/auth/login', {
                    email,
                    password
                })

                if (result.result?.accessToken) {
                    API.accessToken = result.result.accessToken
                    API.refreshToken = result.result.refreshToken
                    updateTokenDisplay()
                }

                statusEl.innerHTML = `<div class="status success">✅ Đăng nhập thành công!<div class="response-box">${JSON.stringify(result, null, 2)}</div></div>`
            } catch (error) {
                statusEl.innerHTML = `<div class="status error">❌ Lỗi: ${error.message}<div class="response-box">${error.toString()}</div></div>`
            }
        }

        async function testRefreshToken() {
            const statusEl = document.getElementById('authStatus')
            statusEl.innerHTML = '<div class="status info">⏳ Đang xử lý...</div>'

            try {
                if (!API.refreshToken) {
                    throw new Error('Không có refresh token. Hãy đăng nhập trước.')
                }

                const result = await API.fetch('POST', '/api/auth/refresh', {
                    refreshToken: API.refreshToken
                })

                if (result.result?.accessToken) {
                    API.accessToken = result.result.accessToken
                    updateTokenDisplay()
                }

                statusEl.innerHTML = `<div class="status success">✅ Làm mới token thành công!<div class="response-box">${JSON.stringify(result, null, 2)}</div></div>`
            } catch (error) {
                statusEl.innerHTML = `<div class="status error">❌ Lỗi: ${error.message}<div class="response-box">${error.toString()}</div></div>`
            }
        }

        async function testGetProducts() {
            const statusEl = document.getElementById('productsStatus')
            statusEl.innerHTML = '<div class="status info">⏳ Đang xử lý...</div>'

            try {
                const result = await API.fetch('GET', '/api/products')
                statusEl.innerHTML = `<div class="status success">✅ Lấy danh sách sản phẩm thành công!<div class="response-box">${JSON.stringify(result, null, 2)}</div></div>`
            } catch (error) {
                statusEl.innerHTML = `<div class="status error">❌ Lỗi: ${error.message}<div class="response-box">${error.toString()}</div></div>`
            }
        }

        async function testGetProductDetail() {
            const statusEl = document.getElementById('productsStatus')
            const productId = document.getElementById('productId').value

            if (!productId) {
                statusEl.innerHTML = '<div class="status error">❌ Vui lòng nhập Product ID</div>'
                return
            }

            statusEl.innerHTML = '<div class="status info">⏳ Đang xử lý...</div>'

            try {
                const result = await API.fetch('GET', `/api/products/${productId}`)
                statusEl.innerHTML = `<div class="status success">✅ Lấy chi tiết sản phẩm thành công!<div class="response-box">${JSON.stringify(result, null, 2)}</div></div>`
            } catch (error) {
                statusEl.innerHTML = `<div class="status error">❌ Lỗi: ${error.message}<div class="response-box">${error.toString()}</div></div>`
            }
        }

        async function testGetProvinces() {
            const statusEl = document.getElementById('locationsStatus')
            statusEl.innerHTML = '<div class="status info">⏳ Đang xử lý...</div>'

            try {
                const result = await API.fetch('GET', '/api/locations/provinces')
                statusEl.innerHTML = `<div class="status success">✅ Lấy danh sách tỉnh/thành phố thành công!<div class="response-box">${JSON.stringify(result, null, 2).substring(0, 500)}...</div></div>`
            } catch (error) {
                statusEl.innerHTML = `<div class="status error">❌ Lỗi: ${error.message}<div class="response-box">${error.toString()}</div></div>`
            }
        }

        async function testGetDistricts() {
            const statusEl = document.getElementById('locationsStatus')
            const provinceCode = document.getElementById('provinceCode').value

            if (!provinceCode) {
                statusEl.innerHTML = '<div class="status error">❌ Vui lòng nhập Province Code</div>'
                return
            }

            statusEl.innerHTML = '<div class="status info">⏳ Đang xử lý...</div>'

            try {
                const result = await API.fetch('GET', `/api/locations/districts/${provinceCode}`)
                statusEl.innerHTML = `<div class="status success">✅ Lấy danh sách quận/huyện thành công!<div class="response-box">${JSON.stringify(result, null, 2)}</div></div>`
            } catch (error) {
                statusEl.innerHTML = `<div class="status error">❌ Lỗi: ${error.message}<div class="response-box">${error.toString()}</div></div>`
            }
        }

        async function testGetWards() {
            const statusEl = document.getElementById('locationsStatus')
            const districtCode = document.getElementById('districtCode').value

            if (!districtCode) {
                statusEl.innerHTML = '<div class="status error">❌ Vui lòng nhập District Code</div>'
                return
            }

            statusEl.innerHTML = '<div class="status info">⏳ Đang xử lý...</div>'

            try {
                const result = await API.fetch('GET', `/api/locations/wards/${districtCode}`)
                statusEl.innerHTML = `<div class="status success">✅ Lấy danh sách phường/xã thành công!<div class="response-box">${JSON.stringify(result, null, 2)}</div></div>`
            } catch (error) {
                statusEl.innerHTML = `<div class="status error">❌ Lỗi: ${error.message}<div class="response-box">${error.toString()}</div></div>`
            }
        }

        async function testGetOrders() {
            const statusEl = document.getElementById('ordersStatus')

            if (!API.accessToken) {
                statusEl.innerHTML = '<div class="status error">❌ Bạn cần đăng nhập trước</div>'
                return
            }

            statusEl.innerHTML = '<div class="status info">⏳ Đang xử lý...</div>'

            try {
                const result = await API.fetch('GET', '/api/orders')
                statusEl.innerHTML = `<div class="status success">✅ Lấy danh sách đơn hàng thành công!<div class="response-box">${JSON.stringify(result, null, 2)}</div></div>`
            } catch (error) {
                statusEl.innerHTML = `<div class="status error">❌ Lỗi: ${error.message}<div class="response-box">${error.toString()}</div></div>`
            }
        }

        async function testGetProfile() {
            const statusEl = document.getElementById('profileStatus')

            if (!API.accessToken) {
                statusEl.innerHTML = '<div class="status error">❌ Bạn cần đăng nhập trước</div>'
                return
            }

            statusEl.innerHTML = '<div class="status info">⏳ Đang xử lý...</div>'

            try {
                const result = await API.fetch('GET', '/api/auth/profile')
                statusEl.innerHTML = `<div class="status success">✅ Lấy hồ sơ thành công!<div class="response-box">${JSON.stringify(result, null, 2)}</div></div>`
            } catch (error) {
                statusEl.innerHTML = `<div class="status error">❌ Lỗi: ${error.message}<div class="response-box">${error.toString()}</div></div>`
            }
        }

        async function testAll() {
            const statusEl = document.getElementById('quickStatus')
            statusEl.innerHTML = '<div class="status info">⏳ Chạy tất cả test...</div>'

            try {
                await testGetProvinces()
                await testGetProducts()
                statusEl.innerHTML = '<div class="status success">✅ Tất cả test đã chạy xong!</div>'
            } catch (error) {
                statusEl.innerHTML = `<div class="status error">❌ Lỗi: ${error.message}</div>`
            }
        }

        function clearAllTokens() {
            API.accessToken = ''
            API.refreshToken = ''
            updateTokenDisplay()
            document.getElementById('quickStatus').innerHTML = '<div class="status success">✅ Đã xóa token</div>'
        }

        function copyToken() {
            if (!API.accessToken) {
                document.getElementById('quickStatus').innerHTML = '<div class="status error">❌ Không có token để copy</div>'
                return
            }

            navigator.clipboard.writeText(API.accessToken).then(() => {
                document.getElementById('quickStatus').innerHTML = '<div class="status success">✅ Đã copy token vào clipboard</div>'
            })
        }

        // Initialize
        updateTokenDisplay()
    </script>
</body>
</html>
